services:
  - type: web
    name: cosci-compiler
    runtime: docker
    plan: free
    dockerContext: ./compiler_server
    dockerfilePath: ./compiler_server/Dockerfile
    healthCheckPath: /api/v2/runtimes
    envVars:
      - key: COSCI_ALLOWED_ORIGIN
        # The compiler API does not use browser cookies. Authentication for
        # protected routes is handled with Firebase bearer tokens, so wildcard
        # CORS safely supports Firebase's two hosting domains and local Flutter
        # development without maintaining a fragile single-origin value.
        value: '*'
      - key: COSCI_JOBS_DIR
        value: /workspace
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
